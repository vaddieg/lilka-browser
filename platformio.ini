; Lilka Browser (ESP32-S3)
; Structure follows lilka-boombox: local boards/, vendored libs in lib/.
; Build/flash: pioarduino (VSCode pioarduino IDE, or any PlatformIO with this platform URL).

[platformio]
default_envs = v2
; Release (v2) has no debug CLI. Use v2-dbg to build with the serial debug
; command interface (goto/dump/heap/key/... — see docs/DEBUG-CLI.md).
;     pio run -e v2-dbg -t upload

[env:v2]
; pioarduino platform: arduino-esp32 3.x + ESP-IDF
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = lilka_v2
framework = arduino
lib_deps =
	; same as lilka-boombox: GFX (ST7789 + canvas) and U8g2 fork for cyrillic fonts
	moononournation/GFX Library for Arduino
	olikraus/U8g2 @ 2.35.9
	; local: miniz (gzip inflate), mbedtls from the core for hashing
	miniz
	; local: esp_new_jpeg (espressif prebuilt .a) — decodes JPEG straight to a target size
	esp_new_jpeg
	; image decoders (bitbank2): JPEG fallback (progressive) + PNG line-by-line
	bitbank2/JpegDEC
	bitbank2/PNGdec
build_flags =
	; release: optimize for size (embedded flash/RAM budget)
	-Os
	-D CORE_DEBUG_LEVEL=0
	-D BOARD_HAS_PSRAM
	; mbedTLS (HTTPS) blows the default 8 KB loopTask stack — the core reads
	; this macro when creating loopTask (cores/esp32/main.cpp)
	-D ARDUINO_LOOP_STACK_SIZE=32768
	; link the esp_new_jpeg prebuilt static lib (S3)
	-L${projectdir}/lib/esp_new_jpeg
	-lesp_new_jpeg
	; PNGdec's internal line buffer must hold two lines (current+prev) for unfiltering;
	; its built-in check only accounts for one, so grow it so ~640px-wide RGBA PNGs work
	; (640*4+32)*2 = 5184
	-D PNG_MAX_BUFFERED_PIXELS=5184
lib_extra_dirs = lib

[env:v2-dbg]
; Debug build: identical to v2 but defines DEBUG, which compiles in the
; serial debug CLI (Browser::serialCmd + the command loop in main.cpp + the
; Buttons::inject/release test hooks). Flags are duplicated (no inheritance)
; on purpose — keeps each env self-contained.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = lilka_v2
framework = arduino
lib_deps =
	moononournation/GFX Library for Arduino
	olikraus/U8g2 @ 2.35.9
	miniz
	esp_new_jpeg
	bitbank2/JpegDEC
	bitbank2/PNGdec
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-D BOARD_HAS_PSRAM
	-D ARDUINO_LOOP_STACK_SIZE=32768
	-L${projectdir}/lib/esp_new_jpeg
	-lesp_new_jpeg
	-D PNG_MAX_BUFFERED_PIXELS=5184
	-DDEBUG
lib_extra_dirs = lib
