; Lilka Browser (ESP32-S3)
; Structure follows lilka-boombox: local boards/, vendored libs in lib/.
; Build/flash: pioarduino (VSCode pioarduino IDE, or any PlatformIO with this platform URL).

[platformio]
default_envs = v2

[env:v2]
; pioarduino platform: arduino-esp32 3.x + ESP-IDF
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = lilka_v2
framework = arduino
lib_deps =
	; same as lilka-boombox: GFX (ST7789 + canvas) and U8g2 fork for cyrillic fonts
	moononournation/GFX Library for Arduino
	olikraus/U8g2 @ 2.35.9
	; local: miniz (gzip inflate), mbedtls from the core for hashing
	miniz
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-D BOARD_HAS_PSRAM
	; mbedTLS (HTTPS) blows the default 8 KB loopTask stack — the core reads
	; this macro when creating loopTask (cores/esp32/main.cpp)
	-D ARDUINO_LOOP_STACK_SIZE=32768
lib_extra_dirs = lib
